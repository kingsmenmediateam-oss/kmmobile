<ion-content class="login-content">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/kingsmen_logo.png" alt="Kingsmen" />
      </div>

      <div class="login-title">{{ tr('loginTitle') }}</div>

      <div class="login-field">
        <label class="login-label">{{ tr('loginUsername') }}</label>
        <input
          class="login-input"
          type="text"
          [(ngModel)]="username"
          autocomplete="username"
          inputmode="text"
          [placeholder]="tr('loginUsername')"
        />
      </div>

      <div class="login-field">
        <label class="login-label">{{ tr('loginPassword') }}</label>
        <div class="login-input-wrap">
          <input
            class="login-input login-input--pw"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="current-password"
            [placeholder]="tr('loginPassword')"
          />
          <button
            type="button"
            class="pwd-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? tr('loginHidePassword') : tr('loginShowPassword')">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <ion-button
        expand="block"
        class="login-btn"
        [disabled]="loading"
        (click)="login()"
      >
        @if (loading) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        {{ tr('loginSubmit') }}
      </ion-button>

      @if (errorMessage) {
        <p class="login-error">{{ errorMessage }}</p>
      }

    </div>
  </div>

</ion-content>
