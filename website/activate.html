<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kingsmen – Activer mon compte</title>
  <link rel="stylesheet" href="./styles.css?v=6" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, var(--km-red-dark) 0%, var(--km-red) 100%);
      padding: 32px 16px;
      margin: 0;
    }

    .activate-card {
      background: var(--km-white);
      border-radius: 24px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .activate-logo {
      height: 72px;
      width: auto;
      margin: 0 auto 16px;
      display: block;
    }

    .activate-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--km-ink);
      margin: 0 0 6px;
    }

    .activate-sub {
      font-size: 13px;
      color: var(--km-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      margin: 0 0 28px;
    }

    .activate-greeting {
      font-size: 14px;
      color: var(--km-muted);
      margin-bottom: 20px;
      line-height: 1.5;
      text-align: left;
    }

    .activate-alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
      font-weight: 500;
      display: none;
    }
    .activate-alert.error   { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .activate-alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .activate-alert.warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
    .activate-alert.show { display: block; }

    #formSection  { display: none; }
    #successSection { display: none; }

    .activate-success-icon { font-size: 48px; margin-bottom: 12px; }
    .activate-success-text { font-size: 15px; color: var(--km-ink); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="activate-card">
    <img src="./assets/kingsmen_logo.png" alt="Kingsmen" class="activate-logo" />
    <h1 class="activate-title">Kingsmen</h1>
    <p class="activate-sub">Activation de votre compte</p>

    <div id="alert" class="activate-alert"></div>

    <!-- État : chargement -->
    <div id="loadingSection">
      <p class="activate-greeting">Vérification du lien…</p>
    </div>

    <!-- État : formulaire -->
    <div id="formSection">
      <p class="activate-greeting" id="greetingText"></p>
      <form id="activateForm" class="form-grid">
        <label>
          Choisissez un mot de passe
          <input type="password" id="password" minlength="6" required autocomplete="new-password" placeholder="Minimum 6 caractères" />
        </label>
        <label>
          Confirmez le mot de passe
          <input type="password" id="passwordConfirm" minlength="6" required autocomplete="new-password" />
        </label>
        <button class="btn primary" type="submit" id="submitBtn">Activer mon compte</button>
      </form>
    </div>

    <!-- État : succès -->
    <div id="successSection">
      <div class="activate-success-icon">✅</div>
      <p class="activate-success-text">Votre compte est activé !<br/>Vous pouvez maintenant vous connecter à l'application Kingsmen.</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://carecode.be/kmmobile/api';

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token') || '';

    const alertEl      = document.getElementById('alert');
    const loadingEl    = document.getElementById('loadingSection');
    const formEl       = document.getElementById('formSection');
    const successEl    = document.getElementById('successSection');
    const greetingEl   = document.getElementById('greetingText');
    const activateForm = document.getElementById('activateForm');
    const submitBtn    = document.getElementById('submitBtn');
    const pwdInput     = document.getElementById('password');
    const pwdConfirm   = document.getElementById('passwordConfirm');

    function showAlert(msg, type = 'error') {
      alertEl.textContent = msg;
      alertEl.className = `activate-alert ${type} show`;
    }

    function hideAlert() { alertEl.className = 'activate-alert'; }

    async function checkToken() {
      if (!token) {
        loadingEl.style.display = 'none';
        showAlert('Lien invalide ou incomplet.', 'error');
        return;
      }
      try {
        const res  = await fetch(`${API_BASE}/account_activate.php?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        loadingEl.style.display = 'none';
        if (!res.ok) {
          const msgs = {
            GONE:    'Ce lien a déjà été utilisé. Contactez un administrateur si nécessaire.',
            EXPIRED: 'Ce lien a expiré (validité 72h). Contactez un administrateur pour en recevoir un nouveau.',
          };
          showAlert(msgs[data.code] || `Lien invalide : ${data.message}`, 'warning');
          return;
        }
        greetingEl.textContent = `Bonjour ${data.firstname} ${data.lastname} (${data.email}), choisissez votre mot de passe :`;
        formEl.style.display = 'block';
      } catch (e) {
        loadingEl.style.display = 'none';
        showAlert('Impossible de joindre le serveur. Réessayez plus tard.', 'error');
      }
    }

    activateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const pwd  = pwdInput.value;
      const pwd2 = pwdConfirm.value;

      if (pwd !== pwd2) { showAlert('Les mots de passe ne correspondent pas.', 'error'); return; }
      if (pwd.length < 6) { showAlert('Minimum 6 caractères.', 'error'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Activation…';

      try {
        const res  = await fetch(`${API_BASE}/account_activate.php`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password: pwd }),
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(data.message || 'Erreur lors de l\'activation.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Activer mon compte';
          return;
        }
        formEl.style.display    = 'none';
        successEl.style.display = 'block';
      } catch (err) {
        showAlert('Erreur réseau. Réessayez.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Activer mon compte';
      }
    });

    checkToken();
  </script>
</body>
</html>
